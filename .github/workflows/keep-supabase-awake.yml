name: Keep Supabase Awake

on:
  schedule:
    # Every 5 days at midnight UTC
    - cron: '0 0 */5 * *'

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping Supabase REST API
        run: |
          curl -s \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "https://npmzmxzagiwxqcfmvjxm.supabase.co/rest/v1/products?select=id&limit=1"